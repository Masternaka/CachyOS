name: Vérification du dépôt
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Syntaxes, cohérence et tests isolés
        run: python3 -B scripts/verifier_depot.py
      # Aucun paquet ou outil manquant n'est installé. Les tests signalent
      # leurs dépendances absentes ; aucun déploiement système n'est exécuté.
