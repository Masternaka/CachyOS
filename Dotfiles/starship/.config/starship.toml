# Catppuccin Powerline, palette Mocha : https://starship.rs/presets/catppuccin-powerline
# Palette du dépôt : Mocha. Le script 04 peut choisir une variante pour le compte.
# Les glyphes demandent une Nerd Font.
add_newline = true
palette = "catppuccin_mocha"
format = """
[](fg:red)$os$username[](fg:red bg:peach)$directory[](fg:peach)\
( [](fg:yellow)$git_branch$git_status[](fg:yellow))\
[ ](fg:lavender)$time[](fg:lavender)$cmd_duration\
$line_break$character"""
command_timeout = 700

[os]
disabled = false
style = "fg:on_red bg:red"
format = "[ $symbol]($style)"

[os.symbols]
CachyOS = " "
Arch = "󰣇 "
Linux = "󰌽 "
Macos = "󰀵 "
Unknown = " "

[username]
show_always = true
style_user = "bold fg:on_red bg:red"
style_root = "bold fg:on_red bg:red"
format = "[$user ]($style)"

[directory]
style = "bold fg:crust bg:peach"
format = "[ $path$read_only ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
style = "bold fg:crust bg:yellow"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:crust bg:yellow"
format = "([$all_status$ahead_behind ]($style))"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:crust bg:lavender"
format = "[  $time ]($style)"

[cmd_duration]
min_time = 2000
style = "yellow"
format = " [ took $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
red = "#f38ba8"
lavender = "#b4befe"
crust = "#11111b"
on_red = "#11111b"

[palettes.catppuccin_macchiato]
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
red = "#ed8796"
lavender = "#b7bdf8"
crust = "#181926"
on_red = "#181926"

[palettes.catppuccin_frappe]
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
red = "#e78284"
lavender = "#babbf1"
